<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="./src/reset.css">
  <link rel="stylesheet" href="./src/responsivo.css">
  <title>Huddle Landing Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  
  <header class="header">
    <img src="./images/logo.svg" alt="Huddle logo">
  </header>

  <main class="main">
    <section class="foto">
      <img class="foto-image" src="./images/illustration-mockups.svg" alt="Illustration mockups">
    </section>

    <section class="content">
      <h1 class="title">Build The Community Your Fans Will Love</h1>
      <p class="info">
        Huddle re-imagines the way we build communities. You have a voice, but so does your audience.
        Create connections with your users as you engage in genuine discussion.
      </p>
      <button class="button">Register</button>
    </section>
  </main>

  <footer class="footer">
    <a href="#" aria-label="Facebook" class="social-link"><i class="fab fa-facebook"></i></a>
    <a href="#" aria-label="Twitter" class="social-link"><i class="fab fa-twitter"></i></a>
    <a href="#" aria-label="Instagram" class="social-link"><i class="fab fa-instagram"></i></a>
  </footer>

</body>

</html>
